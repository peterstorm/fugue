name: secret-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          LOOM_DEPLOY_KEY: ${{ secrets.LOOM_DEPLOY_KEY }}
        run: |
          echo "length=${#LOOM_DEPLOY_KEY}"
          if [ -n "$LOOM_DEPLOY_KEY" ]; then echo PRESENT; else echo ABSENT; fi
