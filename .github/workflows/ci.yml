name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    # Called (reusable) workflows do not inherit repository secrets implicitly;
    # verify needs LOOM_DEPLOY_KEY to clone the private peterstorm/loom git
    # dependency.
    secrets: inherit
