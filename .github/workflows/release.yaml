# Publish the @fuguejs/* packages to npmjs on a version tag.
# Manual dispatch validates the same versions and all nine tarballs, but cannot publish.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Tag whose package versions and artifacts should be validated
        required: true
        type: string

env:
  # Publish order remains dependencies before dependents.
  PACKAGES: framework document-source xlsx adapter-fs adapter-ms-graph adapter-pg adapter-oracle http-auth host
  EXPECTED_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs['release-tag'] }}

jobs:
  verification:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm >= 11.5.1 required for OIDC trusted publishing
      - run: bun install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          expected="${EXPECTED_RELEASE_TAG#v}"
          for pkg in $PACKAGES; do
            actual=$(bun -e "console.log(require('./packages/$pkg/package.json').version)")
            if [ "$actual" != "$expected" ]; then
              echo "::error::packages/$pkg is at $actual but tag expects $expected" >&2
              exit 1
            fi
          done

      - name: Prepare and validate all release tarballs
        run: |
          rm -rf .release
          mkdir .release
          for pkg in $PACKAGES; do
            name=$(bun -e "console.log(require('./packages/$pkg/package.json').name)")
            version=$(bun -e "console.log(require('./packages/$pkg/package.json').version)")
            destination="$GITHUB_WORKSPACE/.release/$pkg"
            mkdir -p "$destination"
            (cd "packages/$pkg" && bun pm pack --destination "$destination")

            # Refuse stale workspace pins before any package can be published.
            bad=$(tar -xzOf "$destination"/*.tgz package/package.json \
              | bun -e 'const pj = await new Response(Bun.stdin.stream()).json();
                  const want = process.argv[1];
                  const deps = { ...pj.dependencies, ...pj.peerDependencies };
                  const bad = Object.entries(deps)
                    .filter(([n, v]) => n.startsWith("@fuguejs/") && v !== want)
                    .map(([n, v]) => n + "@" + v);
                  console.log(bad.join(" "));' "$version")
            if [ -n "$bad" ]; then
              echo "::error::$name tarball pins stale workspace versions: $bad — bump the workspace \"version\" fields in bun.lock" >&2
              exit 1
            fi
          done

      - name: Publish validated tarballs (skip versions already on the registry)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          for pkg in $PACKAGES; do
            name=$(bun -e "console.log(require('./packages/$pkg/package.json').name)")
            version=$(bun -e "console.log(require('./packages/$pkg/package.json').version)")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
              continue
            fi
            npm publish ".release/$pkg"/*.tgz --access public
          done
