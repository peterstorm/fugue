name: verify

on:
  workflow_call:

env:
  # pull_request_target runs the trusted base workflow with secrets but checks
  # out the base branch by default; point the checkouts at the PR's merge ref
  # so the suite tests the proposed code. Every other event uses its own ref.
  CHECKOUT_REF: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}

jobs:
  workspace-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # @peterstorm/loom is a git+ssh dependency of the (now private)
      # peterstorm/loom repo. bun resolves it via a real git clone, so the
      # runner needs a credential: a read-only deploy key on loom, injected
      # through GIT_SSH_COMMAND (bun's git subprocess inherits it).
      - name: SSH access for the private loom git dependency
        env:
          LOOM_DEPLOY_KEY: ${{ secrets.LOOM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$LOOM_DEPLOY_KEY" ]; then
            echo "::error::LOOM_DEPLOY_KEY is not set — @peterstorm/loom is pinned as a git+ssh dependency of the private peterstorm/loom repo; add the read-only deploy key's private half as this secret." >&2
            exit 1
          fi
          mkdir -p .ci-ssh
          printf '%s\n' "$LOOM_DEPLOY_KEY" > .ci-ssh/loom_deploy_key
          chmod 600 .ci-ssh/loom_deploy_key
          echo "GIT_SSH_COMMAND=ssh -i $GITHUB_WORKSPACE/.ci-ssh/loom_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Start disposable Redis
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server
          sudo systemctl stop redis-server 2>/dev/null || true
          redis-server \
            --daemonize yes \
            --bind 127.0.0.1 \
            --protected-mode yes \
            --port 6389 \
            --save '' \
            --appendonly no \
            --requirepass 'fugue-ci-test-password'
          bash scripts/wait-for-redis.sh 'redis://default:fugue-ci-test-password@127.0.0.1:6389'
          printf '%s\n' 'REDIS_URL=redis://default:fugue-ci-test-password@127.0.0.1:6389' >> "$GITHUB_ENV"
      - name: Verify repository
        run: bun run verify

  original-image-oracle-smoke:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.4.2-alpine
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # The alpine bun image ships neither git nor an ssh client; the private
      # loom git dependency needs both (git+ssh clone).
      - name: Git + SSH client for the alpine container
        run: apk add --no-cache git openssh-client
      - name: SSH access for the private loom git dependency
        env:
          LOOM_DEPLOY_KEY: ${{ secrets.LOOM_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "$LOOM_DEPLOY_KEY" ]; then
            echo "::error::LOOM_DEPLOY_KEY is not set — @peterstorm/loom is pinned as a git+ssh dependency of the private peterstorm/loom repo; add the read-only deploy key's private half as this secret." >&2
            exit 1
          fi
          mkdir -p .ci-ssh
          printf '%s\n' "$LOOM_DEPLOY_KEY" > .ci-ssh/loom_deploy_key
          chmod 600 .ci-ssh/loom_deploy_key
          echo "GIT_SSH_COMMAND=ssh -i $GITHUB_WORKSPACE/.ci-ssh/loom_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Driver-loads smoke on the production base image
        run: bun scripts/oracle-driver-smoke.ts
